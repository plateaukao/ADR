<html lang="en">

<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />

<title>ADR Calendar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css?v=1783509647" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>ADR Calendar</h1>
    <span id="entry-count" class="muted"></span>
  </div>
  <nav class="controls">
    <div class="view-switch" role="tablist" aria-label="View">
      <button data-view="month" class="active">Month</button>
      <button data-view="week">Week</button>
      <button data-view="day">Day</button>
      <button data-view="list">List</button>
    </div>
    <div class="nav-buttons">
      <button id="prev" aria-label="Previous">&larr;</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next">&rarr;</button>
    </div>
    <div id="period-label" class="period-label"></div>
    <select id="project-filter" aria-label="Filter by project">
      <option value="">All projects</option>
    </select>
  </nav>
</header>

<main id="calendar"></main>

<aside id="viewer" class="viewer hidden" aria-hidden="true">
  <div class="viewer-inner">
    <div class="viewer-head">
      <div>
        <span id="viewer-project" class="tag"></span>
        <span id="viewer-date" class="muted"></span>
      </div>
      <div class="viewer-actions">
        <button class="viewer-nav viewer-prev" aria-label="Older ADR">&lsaquo;</button>
        <button class="viewer-nav viewer-next" aria-label="Newer ADR">&rsaquo;</button>
        <a id="viewer-raw" target="_blank" rel="noreferrer">Raw</a>
        <button id="viewer-close" aria-label="Close">&times;</button>
      </div>
    </div>
    <article id="viewer-body" class="markdown-body"></article>
    <div class="viewer-foot">
      <button class="viewer-nav viewer-prev" aria-label="Older ADR">&lsaquo;</button>
      <button class="viewer-nav viewer-next" aria-label="Newer ADR">&rsaquo;</button>
    </div>
  </div>
</aside>
<div id="viewer-backdrop" class="backdrop hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="app.js?v=1783509647"></script>
</body>
</html>
